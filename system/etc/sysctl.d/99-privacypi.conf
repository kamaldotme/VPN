net.ipv4.ip_forward=1
net.ipv6.conf.all.forwarding=1
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.accept_source_route=0
net.ipv6.conf.all.accept_source_route=0
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.log_martians=1
net.ipv4.tcp_syncookies=1
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.default.accept_ra=0
net.bridge.bridge-nf-call-iptables=1
net.bridge.bridge-nf-call-ip6tables=1

# Disable IPv6 on all client-facing bridges (NordVPN tunnel is IPv4-only;
# any IPv6 traffic from connected devices would leak around the tunnel)
net.ipv6.conf.br-vlan10.disable_ipv6=1
net.ipv6.conf.br-vlan20.disable_ipv6=1
net.ipv6.conf.br-vlan30.disable_ipv6=1
net.ipv6.conf.br-vlan40.disable_ipv6=1
net.ipv6.conf.br-vlan60.disable_ipv6=1
net.ipv6.conf.br-vlan70.disable_ipv6=1

# Belt-and-suspenders: drop all IPv6 router advertisements on bridges
# (we already do `accept_ra=0` globally, this reinforces per-iface)
net.ipv6.conf.br-vlan10.accept_ra=0
