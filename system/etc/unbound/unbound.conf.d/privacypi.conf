server:
  # Bind locally for AdGuard Home to forward to
  port: 5335
  interface: 127.0.0.1
  do-tcp: yes
  do-udp: yes
  do-ip4: yes
  do-ip6: no
  root-hints: "/var/lib/unbound/root.hints"
  harden-dnssec-stripped: yes
  harden-glue: yes
  harden-referral-path: yes
  harden-below-nxdomain: yes
  harden-large-queries: yes
  # 2026 hardening: refuse weak/deprecated DNSSEC algorithms
  harden-algo-downgrade: yes

  # Privacy hardening
  qname-minimisation: yes
  qname-minimisation-strict: yes
  aggressive-nsec: yes
  prefetch: yes
  prefetch-key: yes
  use-caps-for-id: no

  # 2026 hardening: rate-limit per client to mitigate amplification & local
  # query floods. Numbers are queries per second.
  ratelimit: 1000
  ip-ratelimit: 200

  # No identifying info leakage
  hide-identity: yes
  hide-version: yes

  # Cache
  msg-cache-size: 4m
  rrset-cache-size: 8m
  cache-min-ttl: 60
  cache-max-ttl: 86400

  # Logging — minimal (privacy-first)
  verbosity: 0
  log-queries: no
  log-replies: no
  log-tag-queryreply: no
  log-local-actions: no
  log-servfail: no

  # Bootstrap performance
  num-threads: 2

  # Block IPv6 if we're not using it (we're not)
  do-ip6: no

  # Access control: only the Pi itself
  access-control: 127.0.0.0/8 allow
  access-control: 10.10.0.0/16 allow
  access-control: 0.0.0.0/0 refuse


# Forwarding over DNS-over-TLS (works through VPN tunnels where pure
# recursive resolution may fail due to UDP fragmentation).
# DNSSEC validation is still enforced by Unbound on the forwarded responses.
forward-zone:
  name: "."
  # Plain port 53 — NordVPN blocks port 853 (DoT) through their tunnel.
  # Tunnel itself encrypts the traffic. DNSSEC validation still done at Unbound.
  forward-addr: 1.1.1.1
  forward-addr: 1.0.0.1
  forward-addr: 9.9.9.9
  forward-addr: 149.112.112.112
