# Upstream DNS over plain :53 — only used while a VPN tunnel is the uplink
# (the tunnel encrypts it; some providers block port 853). DNSSEC validation
# is still enforced by Unbound.
forward-zone:
  name: "."
  forward-addr: 1.1.1.1
  forward-addr: 1.0.0.1
  forward-addr: 9.9.9.9
  forward-addr: 149.112.112.112
