# A Pi has no battery clock, and PrivacyPi's DNS needs a correct clock
# (DNSSEC, DNS-over-TLS) before it can resolve NTP pool names — so keep a few
# NTP servers by IP address to break that deadlock (time.cloudflare.com).
server 162.159.200.1 iburst
server 162.159.200.123 iburst
# Step the clock whenever it is off by more than a second, not just at start-up.
makestep 1 -1
