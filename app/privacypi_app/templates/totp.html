{% extends "base.html" %}
{% block title %}Two-factor · PrivacyPi{% endblock %}
{% block content %}
<h2>Two-factor code</h2>
<div class="sub">Enter the 6-digit code from your authenticator app.</div>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="field">
    <input name="code" autocomplete="one-time-code" required maxlength="6" inputmode="numeric"
           style="text-align:center;font-size:24px;letter-spacing:8px;font-family:'JetBrains Mono',monospace">
  </div>
  <button class="btn btn-primary" type="submit" style="width:100%">Verify →</button>
</form>
{% endblock %}
