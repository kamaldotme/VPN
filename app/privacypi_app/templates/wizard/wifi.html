{% extends "wizard/_base.html" %}
{% block step %}Step 3 of {{ steps_total - 1 }}{% endblock %}
{% block wizard %}
<h2>Your private WiFi</h2>
<p class="sub">This replaces the setup network. Your phones, laptops and TVs will join it.</p>
<form method="post" autocomplete="off">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="field"><label>WiFi name</label><input name="ssid" value="{{ form.ssid }}" maxlength="32" placeholder="e.g. Home-Private" required autofocus></div>
  <div class="field"><label>WiFi password (8 or more characters)</label><input type="password" name="psk" minlength="8" maxlength="63" autocomplete="new-password" required></div>
  <div class="field"><label>Type it again</label><input type="password" name="psk2" minlength="8" maxlength="63" autocomplete="new-password" required></div>
  <button class="btn btn-primary" style="width:100%">Continue →</button>
</form>
{% endblock %}
