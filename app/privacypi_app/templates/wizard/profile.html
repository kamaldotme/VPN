{% extends "wizard/_base.html" %}
{% block step %}3{% endblock %}
{% block wizard %}
<h2 style="margin:0 0 8px;font-size:22px;font-weight:600">Pick a profile</h2>
<p class="sub mb-4">You can change this anytime.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="grid" style="gap:8px">
    {% for key, p in profiles.items() %}
    <label style="cursor:pointer">
      <input type="radio" name="profile" value="{{ key }}" required style="display:none" class="prof-r">
      <div class="card prof-card" style="padding:14px;display:flex;gap:12px;align-items:center">
        <span style="font-size:24px">{{ p.icon }}</span>
        <div>
          <div style="font-weight:600;color:var(--text-0)">{{ p.label }}</div>
          <div class="text-xs text-muted">{{ p.description }}</div>
        </div>
      </div>
    </label>
    {% endfor %}
  </div>
  <button class="btn btn-primary mt-4" style="width:100%">Continue →</button>
</form>
<style>
  .prof-r:checked + .prof-card { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 24px var(--accent-glow); }
</style>
{% endblock %}
