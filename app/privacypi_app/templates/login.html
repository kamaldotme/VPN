{% extends "base.html" %}
{% block title %}Sign in · PrivacyPi{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="sub">Welcome back to your privacy router.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <div class="field">
    <label for="login-username">Username</label>
    <input id="login-username" name="username" autofocus required autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="login-username-hint">
    <p class="field-hint" id="login-username-hint">Usually <strong>admin</strong>.</p>
  </div>
  <div class="field">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" name="password" required autocomplete="current-password">
  </div>
  <label class="check">
    <input type="checkbox" name="remember" value="1">
    <span>Keep me signed in on this device</span>
  </label>
  <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
</form>
{% endblock %}
